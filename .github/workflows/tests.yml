name: Tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y openssl wimtools p7zip-full
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff --version
      - run: python -m ruff check --config pyproject.toml pxetrace tests tools
      - run: mypy pxetrace
      - run: python -m pxetrace --demo
